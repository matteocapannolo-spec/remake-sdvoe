# Preview on GitHub Pages: https://matteocapannolo-spec.github.io/remake-sdvoe/
# Builds the static site into the /remake-sdvoe sub-folder (BASE_PATH) and publishes it on every
# push to main. Sub-folder builds carry a noindex tag, so the preview stays out of search engines.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      # GitHub Pages runs Jekyll by default; this file turns it off so every folder is served as is
      - run: touch build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
